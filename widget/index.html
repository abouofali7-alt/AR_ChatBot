<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AR_ChatBot Widget</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
.chat-bubble{position:fixed;bottom:20px;right:20px;width:60px;height:60px;border-radius:50%;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:99999;transition:transform .2s}
.chat-bubble:hover{transform:scale(1.1)}
.chat-bubble svg{width:28px;height:28px;fill:#fff}
.chat-window{position:fixed;bottom:90px;right:20px;width:380px;max-height:520px;border-radius:16px;background:#fff;box-shadow:0 8px 32px rgba(0,0,0,.18);display:none;flex-direction:column;overflow:hidden;z-index:99998;font-family:system-ui,-apple-system,sans-serif}
.chat-window.open{display:flex}
.chat-header{background:#2563eb;color:#fff;padding:16px;display:flex;align-items:center;justify-content:space-between}
.chat-header h3{font-size:15px;font-weight:600}
.chat-header .close{background:none;border:none;color:#fff;cursor:pointer;font-size:20px;padding:0 4px}
.chat-messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;max-height:360px}
.chat-msg{max-width:80%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.45;word-break:break-word}
.chat-msg.user{align-self:flex-end;background:#2563eb;color:#fff;border-bottom-right-radius:4px}
.chat-msg.bot{align-self:flex-start;background:#f1f5f9;color:#1e293b;border-bottom-left-radius:4px}
.chat-typing{align-self:flex-start;padding:10px 14px;background:#f1f5f9;border-radius:14px;display:none}
.chat-typing span{display:inline-block;width:6px;height:6px;border-radius:50%;background:#94a3b8;margin:0 2px;animation:typing .8s infinite}
.chat-typing span:nth-child(2){animation-delay:.15s}
.chat-typing span:nth-child(3){animation-delay:.3s}
@keyframes typing{0%,100%{opacity:.3}50%{opacity:1}}
.chat-input{display:flex;padding:12px;border-top:1px solid #e2e8f0;gap:8px}
.chat-input input{flex:1;border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;font-size:14px;outline:none}
.chat-input input:focus{border-color:#2563eb}
.chat-input button{background:#2563eb;color:#fff;border:none;border-radius:10px;padding:10px 16px;cursor:pointer;font-size:14px}
.chat-input button:hover{background:#1d4ed8}
</style>
</head>
<body>
<div class="chat-bubble" id="chatBubble">
<svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.2L4 17.2V4h16v12z"/></svg>
</div>
<div class="chat-window" id="chatWindow">
<div class="chat-header">
<h3 id="chatTitle">Chat with us</h3>
<button class="close" id="closeBtn">&times;</button>
</div>
<div class="chat-messages" id="chatMessages"></div>
<div class="chat-typing" id="chatTyping"><span></span><span></span><span></span></div>
<div class="chat-input">
<input type="text" id="chatInput" placeholder="Type a message..." autocomplete="off">
<button id="sendBtn">Send</button>
</div>
</div>

<script>
(function(){
  var config = window.ARChatBotConfig || {};
  var apiUrl = config.apiUrl || 'http://localhost:3000';
  var apiKey = config.apiKey || '';
  var title = config.title || 'Chat with us';
  var language = config.language || 'ar';
  var sessionId = 'web_' + Math.random().toString(36).slice(2, 10);

  document.getElementById('chatTitle').textContent = title;

  var bubble = document.getElementById('chatBubble');
  var win = document.getElementById('chatWindow');
  var msgs = document.getElementById('chatMessages');
  var input = document.getElementById('chatInput');
  var sendBtn = document.getElementById('sendBtn');
  var typing = document.getElementById('chatTyping');
  var closeBtn = document.getElementById('closeBtn');

  bubble.onclick = function(){ win.classList.toggle('open'); };
  closeBtn.onclick = function(){ win.classList.remove('open'); };

  function addMsg(text, role){
    var div = document.createElement('div');
    div.className = 'chat-msg ' + role;
    div.textContent = text;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function showTyping(){ typing.style.display = 'block'; msgs.scrollTop = msgs.scrollHeight; }
  function hideTyping(){ typing.style.display = 'none'; }

  async function send(){
    var text = input.value.trim();
    if(!text) return;
    input.value = '';
    addMsg(text, 'user');
    showTyping();
    sendBtn.disabled = true;

    try {
      var res = await fetch(apiUrl + '/api/webhook', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, sessionId: sessionId, language: language })
      });
      var data = await res.json();
      hideTyping();
      addMsg(data.reply || 'Sorry, something went wrong.', 'bot');
    } catch(e) {
      hideTyping();
      addMsg('Connection error. Please try again.', 'bot');
    }
    sendBtn.disabled = false;
  }

  sendBtn.onclick = send;
  input.onkeydown = function(e){ if(e.key === 'Enter') send(); };

  addMsg(config.welcomeMessage || 'Hi! How can I help you?', 'bot');
})();
</script>
</body>
</html>
